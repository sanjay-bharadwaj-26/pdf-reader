name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (also copies PDF.js into src/lib)
        run: npm install

      - name: Generate icons
        run: npm run icons

      - name: Build
        run: npm run build

      - name: Upload installer and portable exe
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pdf-reader.exe
