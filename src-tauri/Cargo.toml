[package]
name = "pdf-reader"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# Smallest possible executable
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
